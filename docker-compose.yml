# ---------------------------------------------------------------------------
# Lokale stack: PostgreSQL, migraties met demo-seed en de Next.js-app.
#
#   docker compose up --build
#
# Daarna staat de site op http://localhost:3000. Dit bestand is bedoeld voor
# development en acceptatie; voor een VPS met HTTPS is er
# docker-compose.production.yml.
# ---------------------------------------------------------------------------
name: homeandlivingdeals

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hald}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hald}
      POSTGRES_DB: ${POSTGRES_DB:-homeandlivingdeals}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hald} -d ${POSTGRES_DB:-homeandlivingdeals}']
      interval: 5s
      timeout: 5s
      retries: 12

  # Eenmalige stap: migraties uitvoeren en (buiten productie) demo-inhoud seeden.
  # De seed doet niets wanneer APP_ENV=production of DEMO_CONTENT_ENABLED=false.
  migrate:
    build:
      context: .
      target: jobs
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hald}:${POSTGRES_PASSWORD:-hald}@db:5432/${POSTGRES_DB:-homeandlivingdeals}?schema=public
      CONTENT_PROVIDER: ${CONTENT_PROVIDER:-template}
      DEMO_CONTENT_ENABLED: ${DEMO_CONTENT_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hald}:${POSTGRES_PASSWORD:-hald}@db:5432/${POSTGRES_DB:-homeandlivingdeals}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DEMO_CONTENT_ENABLED: ${DEMO_CONTENT_ENABLED:-true}
      SEARCH_ENGINE_INDEXING_ENABLED: ${SEARCH_ENGINE_INDEXING_ENABLED:-false}
      ADS_ENABLED: ${ADS_ENABLED:-false}
      AFFILIATE_LINKS_ENABLED: ${AFFILIATE_LINKS_ENABLED:-false}
      NEXT_PUBLIC_ADS_ENABLED: ${NEXT_PUBLIC_ADS_ENABLED:-false}
      NEXT_PUBLIC_AD_PROVIDER: ${NEXT_PUBLIC_AD_PROVIDER:-none}
      CONTENT_PROVIDER: ${CONTENT_PROVIDER:-template}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      CRON_SECRET: ${CRON_SECRET:-}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-HomeAndLivingDealsBot/0.1 (+https://homeandlivingdeals.nl/over)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-local-dev}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-alleen-voor-lokaal-gebruik-minimaal-32-tekens}
    ports:
      - '${APP_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
